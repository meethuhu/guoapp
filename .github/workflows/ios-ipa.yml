name: Build iOS IPA (test)

on:
  push:
    branches:
      - ci/ios-ipa
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GH_TOKEN: ${{ github.token }}

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: Fetch FFmpegKit frameworks
        shell: bash
        run: |
          set -euo pipefail
          asset=$(gh api repos/sk3llo/ffmpeg_kit_flutter/releases/tags/8.1.2-min-gpl \
            --jq '.assets[] | select(.name == "ffmpeg-kit-ios-min-gpl-8.1.2.zip") | .url')
          curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o "$RUNNER_TEMP/ffmpeg-kit-ios-min-gpl-8.1.2.zip" "$asset"
          unzip -tq "$RUNNER_TEMP/ffmpeg-kit-ios-min-gpl-8.1.2.zip"
          echo "FFMPEG_KIT_IOS_URL=file://$RUNNER_TEMP/ffmpeg-kit-ios-min-gpl-8.1.2.zip" >> "$GITHUB_ENV"
      - name: Build unsigned IPA
        run: python scripts/build_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
